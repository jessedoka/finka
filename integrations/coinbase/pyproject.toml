[project]
name = "finka-coinbase"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx==0.28.1", "pyjwt>=2.13.0", "cryptography>=43.0.0", "core"]

[tool.uv.sources]
core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
