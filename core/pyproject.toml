[project]
name = "core"
version = "0.1.0"
description = "Finka CORE"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "alembic==1.14.1",
    "httpx==0.28.1",
    "cryptography>=43.0.0",
    # Bundled providers. Core discovers them through the "finka.providers"
    # entry-point group, so they must be installed in the same environment.
    "finka-monzo",
    "finka-trading212",
    "finka-coinbase",
]

[tool.uv.sources]
finka-monzo = { workspace = true }
finka-trading212 = { workspace = true }
finka-coinbase = { workspace = true }

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
